# Prevents the HDMI-CEC "standby" signal from the TV taking the Pi down
# with it. The Pi's CEC-to-input driver turns a CEC power-off command into
# a KEY_POWER input event; systemd-logind's default (HandlePowerKey=poweroff)
# reacts to that like a real power-button press and shuts the Pi down -
# and Pi 4 hardware can't be woken from a true poweroff via CEC/remote, so
# only a physical power-cycle brings it back. See docs/tracking.md for the
# full debugging trail.
#
# Install: sudo cp logind-ignore-cec-power.conf /etc/systemd/logind.conf.d/
#          sudo systemctl restart systemd-logind
#
# Long-pressing the power button reboots instead - useful as a manual
# recovery option. Depends on the TV's CEC signal for a held button
# actually producing a sustained key-press event, not just an instant
# press+release - confirmed working by testing, not assumed.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=reboot
