# keyd remap for the Fire TV remote (3rd-gen Alexa Voice Remote, 2020 Fire
# TV Stick), so its buttons arrive as the keys Litefin's LinuxAdapter.js
# expects. See docs/tracking.md for how each button's raw code was found
# (evtest) and why specific targets were chosen.
#
# Install: sudo cp firetv-remote.keyd.conf /etc/keyd/firetv-remote.conf
#          sudo systemctl enable --now keyd
#
# Matches all keyboards, not just the remote's vendor:product (0171:0413) -
# that specific-ID form left keyd ignoring the device entirely (untested why;
# the shipped example config uses `*`, so this follows the documented
# pattern). Safe: normal keyboards don't send KEY_BACK/KEY_HOMEPAGE anyway.
[ids]

*

[main]
# Back -> Escape (LinuxAdapter listens for Escape as "back", not KEY_BACK)
back = esc
# Home -> Insert (LinuxAdapter's Home key - NOT F1, which Chromium hardcodes
# to its own Help action regardless of page JS, confirmed in Phase 2)
homepage = insert

# Everything else (arrows, OK/enter, menu, play/pause, rewind, fast-forward,
# volume, mute) already sends standard keys Litefin/Chromium understand -
# left unmapped, passes through unchanged.
